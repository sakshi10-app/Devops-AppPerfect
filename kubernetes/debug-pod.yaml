apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
spec:
  serviceAccountName: my-service-account
  containers:
  - name: debug
    image: bitnami/kubectl:latest
    command: ["sleep", "3600"]
    volumeMounts:
    - name: token-volume
      mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      readOnly: true
  volumes:
  - name: token-volume
    projected:
      sources:
      - serviceAccountToken:
          path: token
          expirationSeconds: 3600
          audience: api
